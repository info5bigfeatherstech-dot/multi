<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="clearPlastic1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0" stop-opacity="0.8"/>
      <stop offset="25%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#F1F5F9" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <filter id="tierShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0F1F3D" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="500" rx="20" fill="#F8FAFC"/>

  <!-- Pedestal Shadow -->
  <ellipse cx="300" cy="430" rx="190" ry="22" fill="#E2E8F0" opacity="0.6"/>

  <g filter="url(#tierShadow)">
    <!-- Bottom Tier (Tier 4 / Siphon Base) -->
    <rect x="180" y="340" width="240" height="70" rx="16" fill="url(#clearPlastic1)" stroke="#94A3B8" stroke-width="2"/>
    <rect x="175" y="335" width="250" height="12" rx="6" fill="#F97316"/>
    <!-- Sprouts / Beans inside bottom tier -->
    <circle cx="230" cy="375" r="7" fill="#84CC16"/>
    <circle cx="260" cy="380" r="6" fill="#84CC16"/>
    <circle cx="300" cy="375" r="8" fill="#84CC16"/>
    <circle cx="340" cy="380" r="7" fill="#84CC16"/>
    <circle cx="370" cy="372" r="6" fill="#84CC16"/>

    <!-- Middle Tier 2 -->
    <rect x="180" y="255" width="240" height="75" rx="16" fill="url(#clearPlastic1)" stroke="#94A3B8" stroke-width="2"/>
    <rect x="175" y="250" width="250" height="12" rx="6" fill="#0F1F3D"/>
    <!-- Fresh green sprouts -->
    <path d="M220 295 Q230 280 240 295" stroke="#16A34A" stroke-width="4" fill="none"/>
    <circle cx="220" cy="298" r="6" fill="#22C55E"/>
    <path d="M275 292 Q285 272 295 292" stroke="#16A34A" stroke-width="4" fill="none"/>
    <circle cx="280" cy="298" r="7" fill="#22C55E"/>
    <path d="M340 294 Q350 274 360 294" stroke="#16A34A" stroke-width="4" fill="none"/>
    <circle cx="345" cy="298" r="6" fill="#22C55E"/>

    <!-- Middle Tier 1 -->
    <rect x="180" y="170" width="240" height="75" rx="16" fill="url(#clearPlastic1)" stroke="#94A3B8" stroke-width="2"/>
    <rect x="175" y="165" width="250" height="12" rx="6" fill="#F97316"/>
    <circle cx="240" cy="210" r="6" fill="#EAB308"/>
    <circle cx="290" cy="215" r="7" fill="#EAB308"/>
    <circle cx="350" cy="210" r="6" fill="#EAB308"/>

    <!-- Top Water Tray / Lid -->
    <rect x="180" y="110" width="240" height="50" rx="14" fill="#0F1F3D"/>
    <!-- Lid Knob -->
    <rect x="270" y="85" width="60" height="25" rx="10" fill="#F97316"/>
    <circle cx="300" cy="97" r="4" fill="#FFFFFF"/>

    <!-- Water drops / Sprout icons -->
    <circle cx="300" cy="140" r="5" fill="#38BDF8"/>
  </g>

  <!-- Green fresh badge accent icon in corner -->
  <g transform="translate(410, 110)">
    <circle cx="20" cy="20" r="22" fill="#22C55E"/>
    <path d="M15 22 C15 15 25 15 25 22 Z" fill="#FFFFFF"/>
    <path d="M20 22 V27" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
