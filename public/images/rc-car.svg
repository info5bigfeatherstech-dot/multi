<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" rx="16" fill="#F8FAFC"/>
  <!-- RC Racing Car -->
  <path d="M90 190 L110 140 L160 120 L240 120 L290 150 L320 190 Z" fill="#DC2626"/>
  <!-- Windshield -->
  <polygon points="170,125 230,125 245,150 155,150" fill="#38BDF8" opacity="0.8"/>
  <!-- Spoiler -->
  <rect x="75" y="145" width="25" height="6" rx="2" fill="#0F172A"/>
  <line x1="85" y1="151" x2="85" y2="175" stroke="#0F172A" stroke-width="4"/>
  <!-- Decal -->
  <path d="M180 160 L220 160" stroke="#FACC15" stroke-width="5" stroke-linecap="round"/>
  <!-- Wheels -->
  <circle cx="130" cy="205" r="28" fill="#1E293B"/>
  <circle cx="130" cy="205" r="14" fill="#F97316"/>
  <circle cx="280" cy="205" r="28" fill="#1E293B"/>
  <circle cx="280" cy="205" r="14" fill="#F97316"/>
  <!-- Antenna -->
  <line x1="210" y1="120" x2="230" y2="70" stroke="#475569" stroke-width="3"/>
  <circle cx="230" cy="70" r="4" fill="#DC2626"/>
</svg>
